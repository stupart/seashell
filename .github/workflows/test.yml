name: Reliability gym
on:
  # Local CI is the default. Hosted execution must be explicitly requested.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Media dependencies
        run: brew install ffmpeg
      - name: Typecheck, regressions, media, native compilation, capture storage and repeated meetings
        run: bun run ci
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seashell-gym-${{ github.run_id }}
          path: |
            .ci-results/
            .gym-results/
          include-hidden-files: true
          retention-days: 14
